name: Bug report
description: Report a problem with weather-mcp
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `uv run weather-mcp ...`
        2. Send tool call ...
        3. Observed ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit SHA
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.x"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 14 / ..."

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
