[project]
name = "weather-mcp"
version = "0.1.0"
description = "MCP server wrapping Open-Meteo for a voice assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.27.1",
]

[project.scripts]
weather-mcp = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["main.py", "open_meteo.py", "formatting.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
